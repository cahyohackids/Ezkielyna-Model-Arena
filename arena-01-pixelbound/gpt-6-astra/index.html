<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101f28"><meta name="description" content="One small courier. A world worth reconnecting. An original pixel platform adventure.">
  <title>PIXELBOUND — Lost Signal</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="wordmark" href="#" id="home" aria-label="Pixelbound main menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17h4v5H3zm7-7h4v12h-4zm7-8h4v20h-4z"/></svg>PIXELBOUND<span class="edition">LOST SIGNAL</span></a>
      <div class="top-right"><span class="network-status"><i></i> OFFLINE ADVENTURE</span><button id="sound-btn" class="icon-button" aria-label="Mute audio" title="Mute audio">♫</button><button id="fullscreen-btn" class="icon-button" aria-label="Enter fullscreen" title="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
    </header>
    <section class="stage" id="stage" aria-label="Pixelbound game">
      <canvas id="game" width="960" height="540" tabindex="-1" aria-label="Game world. Use A and D to move, Space to jump, Shift to dash, and Escape to pause."></canvas>
      <div class="vignette" aria-hidden="true"></div>
      <div id="hud" class="hud hidden">
        <div class="hud-left"><div class="pip-badge" aria-hidden="true"><span></span></div><div><div class="hud-caption">PIP <span id="sector-label">/ 01</span></div><div id="health" class="energy" aria-label="3 energy cells"></div></div><div class="hud-divider"></div><div class="hud-count"><span class="bit-icon"></span><b id="bits-count">00</b><small id="bits-total">/ 50</small></div><div class="hud-count cores"><span class="core-icon"></span><b id="cores-count">0</b><small>/ 3</small></div></div>
        <div class="hud-right"><div class="dash-meter"><span>DASH <kbd>⇧</kbd></span><div><i id="dash-fill"></i></div></div><button class="icon-button pause-button" id="pause-btn" aria-label="Pause game" title="Pause (Esc)"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button></div>
      </div>
      <div id="level-caption" class="level-caption hidden"><span id="level-number">SECTOR 01</span><strong id="level-name">Signal Meadow</strong></div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <div id="screens" class="screens"></div>
      <div class="touch-controls" id="touch-controls" aria-label="Touch controls">
        <div class="touch-group"><button data-key="left" aria-label="Move left">◀</button><button data-key="right" aria-label="Move right">▶</button></div>
        <div class="touch-group"><button data-key="dash" class="touch-dash" aria-label="Dash">⇢<small>DASH</small></button><button data-key="jump" class="touch-jump" aria-label="Jump">↑<small>JUMP</small></button></div>
      </div>
      <div id="rotate-note">For a wider world, turn your device sideways.</div>
    </section>
    <footer class="bottombar"><span class="footer-mission"><i></i> ONE SMALL COURIER. A WORLD WORTH RECONNECTING.</span><span class="footer-keys"><kbd>A</kbd><kbd>D</kbd> MOVE <span>·</span><kbd>SPACE</kbd> JUMP <span>·</span><kbd>SHIFT</kbd> DASH</span><span class="version">V.1.0 <span>●</span></span></footer>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
